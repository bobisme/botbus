#:schema https://raw.githubusercontent.com/bobisme/botbox/refs/heads/main/schemas/botbox.schema.json

version = "1.0.15"
push_main = false

[project]
name = "rite"
type = ["cli"]
languages = []
default_agent = "rite-dev"
channel = "rite"
release_instructions = """
- Bump the version of all crates
- Regenerate the Cargo.lock
- Add notes to CHANGELOG.md
- If the README.md references the version, update it.
- Commit
- Tag and push: `maw release vX.Y.Z`
- use `gh release create vX.Y.Z --notes "..."`
- Install locally: `maw exec default -- just install`
"""

# Companion tools to enable
[tools]
bones = true
maw = true
seal = true
rite = true
vessel = true

# Code review configuration
[review]
enabled = true
reviewers = ["security"]

[agents.dev]
model = "opus"
max_loops = 20
pause = 2
timeout = 900

[agents.dev.missions]
enabled = true
max_workers = 4
max_children = 12
checkpoint_interval_sec = 30

[agents.dev.multi_lead]
enabled = false
